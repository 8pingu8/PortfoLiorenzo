- title: "Astrogirlz"
  slug: "astrogirlz"
  description: "A visual novel 3D game developed during STEMdays 2025, following a girl robot protagonist stranded on an alien planet. Through exploration, dialogue, and puzzle-solving, she uncovers the mystery of what happened while helping the leading doctor back on the spaceship and return Home."
  longDescription: |
    # Game Concept
    Astrogirlz is an educational game project developed during STEMdays 2025, a summer camp focused on girls' empowerment in STEM fields. The game follows a girl robot who finds herself stranded on an alien planet while the spaceship is infested with alien plants. Through exploration of the environment and past camp sites left by the leading doctor, players piece together what happened and help restore the ship's ability to travel again.

    ## Key Features
    - Story-driven 3D visual novel gameplay with extensive dialogue system
    - Exploration mechanics across hand-crafted alien environments
    - Multiple puzzle minigames integrated into the narrative
    - Character-driven narrative focusing on discovery and problem-solving
    - Complete narrative arc from mystery to resolution
    - Educational value in both story and development process

    ## Technical Implementation
    As the project lead and mentor, I (with the help of my team) guided a team of girls through their first 3D game development experience:

    - ### Core Systems
      - **Dialogue System**: Implemented a comprehensive dialogue system to tell the story and reveal the mystery
      - **Exploration System**: Built interactive 3D environments allowing players to discover past camp sites and environmental storytelling
      - **Puzzle Framework**: Created a modular system for various puzzle minigames integrated into the exploration through UI
      - **3D Environment Interaction**: Developed interaction systems for examining objects and locations

    - ### Technical Stack
      - **Engine**: Unreal Engine 5
      - **Language**: C++ and Blueprints
      - **Key Features**: 3D graphics, Visual novel elements, Environmental storytelling, Puzzle mechanics, Dialogue system, Scene management

    ## Educational Leadership
    This project was particularly special as it combined 3D game development with educational mentorship:

    - ### Teaching Highlights
      - Introduced complete beginners to 3D game development and Unreal Engine 5
      - Guided students through the entire development process from concept to completion
      - Ensured each team member could contribute meaningfully to the project
      - Balanced learning objectives with project completion goals
      - Supported students in creating all alien environments themselves, which stands as the project's biggest achievement

    - ### Project Management
      - Structured the development timeline effectively
      - Divided tasks based on individual interests and abilities
      - Maintained team motivation and engagement throughout
      - Successfully delivered a complete game within the time constraint
      - Facilitated the creation of all alien environments by the students themselves

    The project's success is measured not just in the final product, but in the educational impact and confidence built in the participating students. The fact that the girls not only developed the game features and functionalities themselves, all while writing a coherent story, but also created all the alien environments by themselves represents a remarkable achievement, demonstrating both creative expression and technical learning. We achieved our goal of creating a complete 3D visual novel game while ensuring every team member learned and contributed to the final product.
