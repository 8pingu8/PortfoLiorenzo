- title: "A Tale from GrayHallow"
  slug: "a-tale-from-grayhallow"
  description: "A cozy, spooky story-driven 3D game developed during the Game Dev TV Halloween Game Jam. Follow Bob, a child struggling to make friends in his new village, as he discovers a magic book that awakens friendly spirits and mischievous monsters, leading to an unforgettable Halloween night of friendship and discovery."
  longDescription: |
    # Game Concept
    A Tale from GrayHallow is a cozy, spooky adventure game developed during the Game Dev TV Halloween Game Jam - my first game jam experience! The game tells the heartwarming story of Bob, a child recently transferred to the village of GrayHallow who struggles with making friends and spends most of his time in the library. On Halloween, Bob discovers a magic book containing a ritual "for the loneliest" and decides to perform it in the village graveyard. The ritual awakens both friendly spirits and mischievous monsters, setting Bob on a journey to befriend the spirits, recover their stolen belongings from the pranking monsters, and finally find the companionship he's been seeking.

    ## Key Features
    - Cozy, spooky visual aesthetic with beautiful night-time village and graveyard environments
    - Complete narrative exploring the town, its characters, and Bob's personal growth
    - Unique storytelling mechanics: The story is told through comics displayed on an old TV, creating a very suggestive and interesting narrative experience
    - The Pipizap: A unique Halloween-themed rock-paper-scissors combat system with funny custom rules
    - Exploration mechanics allowing players to discover GrayHallow and interact with its inhabitants
    - Character-driven story focusing on friendship, loneliness, and finding your place
    - Rich atmospheric environments emphasizing visual storytelling

    ## Technical Implementation
    As the project lead and programmer, I guided a team of 6 people through our first game development and game jam experience, working together remotely:

    - ### Core Systems
      - **Pipizap Combat System**: Developed a custom rock-paper-scissors combat system with Halloween-themed mechanics and special rules that make each encounter unique and engaging
      - **Comic TV Storytelling System**: Implemented a unique storytelling mechanic where narrative sequences are presented as comics displayed on an old TV screen, creating a very suggestive and visually interesting way to tell the story
      - **Dialogue System**: Implemented a dialogue system to tell Bob's story and facilitate interactions with spirits and townspeople
      - **Exploration System**: Built interactive 3D environments for exploring GrayHallow village and the graveyard
      - **Visual Atmosphere**: Focused heavily on creating a cozy, spooky aesthetic with carefully crafted lighting and environmental design for the night-time setting

    - ### Technical Stack
      - **Engine**: Unreal Engine 5
      - **Language**: C++ and Blueprints
      - **Key Features**: 3D graphics, Custom combat mechanics, Comic TV storytelling system, Dialogue system, Environmental storytelling, Atmospheric lighting

    ## Game Jam Leadership
    This project presented unique challenges as my first game jam experience, leading a team where everyone was new to game development:

    - ### Team Structure
      - Coordinated a diverse team of 6 members with dedicated roles: story, sound, graphics, and programming
      - Managed collaboration across different skill levels, all experiencing their first game development project
      - Balanced creative contributions while maintaining project scope for the jam deadline

    - ### Development Challenges
      - Worked within the tight constraints of a game jam timeline
      - Navigated scheduling difficulties as team members had other commitments, resulting in limited available time
      - Provided guidance and leadership despite being the only team member with game development experience
      - Focused heavily on visual polish and atmosphere, dedicating significant time to creating the cozy, spooky aesthetic that became one of the game's strongest features

    - ### Project Management
      - Structured tasks and managed workflow to ensure progress despite time constraints
      - Prioritized visual development and narrative completion to deliver a cohesive experience
      - Maintained team motivation and ensured everyone could contribute meaningfully despite the challenges
      - Successfully delivered a complete game that met the jam deadline

    The project's success demonstrates adaptability in high-pressure situations and effective leadership in challenging team dynamics. Despite everyone being new to game development and facing significant time constraints, we created a complete, visually striking game with a heartwarming story that showcases the power of collaboration and creative problem-solving.
